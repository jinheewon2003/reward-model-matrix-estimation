[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rme"
version = "0.1.0"
description = "Matrix-estimation / latent-factor reward models for RLHF, benchmarked against Bradley-Terry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jinhee Won", email = "jinhee@mit.edu" }]

dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers", "openai>=1.0.0"]
data = ["datasets", "huggingface_hub"]
dev = ["pytest"]
all = ["rme[embeddings,data,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
